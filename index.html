<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TonightUSA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            max-width: 420px;
            width: 100%;
            padding: 2rem 1.5rem;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .bio {
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .link {
            display: block;
            padding: 1rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            transition: background 0.2s, border-color 0.2s;
        }

        .link:hover {
            background: #252525;
            border-color: #555;
        }

        .footer {
            margin-top: 2.5rem;
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">T</div>
        <h1>TonightUSA</h1>
        <p class="bio">Discover the best profiles</p>

        <div class="links">
            <a href="https://t.me/+41Mir8Qk5RUxMWM0" class="link">Telegram</a>
        </div>

        <p class="footer">&copy; 2026 TonightUSA</p>
    </div>
</body>
</html>
